<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Equipment | Lab Equipment Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">🔬 Lab Equipment Management</div>
    <nav><a href="index.html">Home</a><a href="list.html">All Equipment</a><a href="listOne.html">Search</a><a href="insert.html">Add Equipment</a><a class="active" href="update.html">Update</a><a href="delete.html">Delete</a><a href="users.html">Users</a><a href="request.html">Request</a><a href="issues.html">Issue / Return</a><a href="reports.html">Reports</a></nav>
  </header>
  <main class="page">
    <div class="page-heading"><span class="eyebrow">KEEP IT UPDATED</span><h1>Update equipment</h1><p>Enter an equipment ID, load its details, then edit the fields you want to change.</p></div>
    <section class="panel form-panel">
      <form id="updateForm">
        <div class="form-grid">
          <label>Equipment ID<input type="number" id="equipment_id" min="1" placeholder="e.g. 101" required></label>
          <label>Name<input type="text" id="name" placeholder="Enter equipment name" required></label>
          <label>Category<select id="category" required><option value="">Choose a category</option><option>Electronics</option><option>Chemistry</option><option>Physics</option><option>Biology</option><option>Computer</option><option>Mechanical</option><option>Other</option></select></label>
          <label>Status<select id="status" required><option>Available</option><option>Unavailable</option><option>Damaged</option></select></label>
          <label>Total quantity<input type="number" id="quantity" min="0" step="1" placeholder="e.g. 10" required></label>
          <label>Available quantity<input type="number" id="available_quantity" min="0" step="1" placeholder="e.g. 10" required></label>
        </div>
        <div class="form-actions"><button class="btn primary" type="submit">Update Equipment</button><button class="btn secondary" type="button" id="loadBtn">Load current details</button><button class="btn secondary" type="reset">Clear Form</button></div>
        <p id="message" class="message" role="status"></p>
      </form>
    </section>
  </main>
  <footer>Lab Equipment Management · Lab Equipment Management System</footer>
<script>const eq = () => ({
  equipment_id: Number(document.getElementById("equipment_id").value),
  name: document.getElementById("name").value.trim(),
  category: document.getElementById("category").value,
  quantity: Number(document.getElementById("quantity").value),
  available_quantity: Number(document.getElementById("available_quantity").value),
  status: document.getElementById("status").value
});
document.getElementById("loadBtn").addEventListener("click", async () => {
  const id = document.getElementById("equipment_id").value, message = document.getElementById("message");
  if (!id) { message.textContent = "Enter an equipment ID first."; message.className = "message error"; return; }
  try {
    const r = await fetch("/equipment/" + encodeURIComponent(id));
    if (!r.ok) throw new Error(r.status === 404 ? "Equipment not found." : "Request failed: " + r.status);
    const item = (await r.json())[0];
    ["name", "category", "quantity", "available_quantity", "status"].forEach(k => document.getElementById(k).value = item[k]);
    message.textContent = "Details loaded. Edit and click Update."; message.className = "message success";
  } catch (err) { message.textContent = err.message; message.className = "message error"; }
});
document.getElementById("updateForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const id = document.getElementById("equipment_id").value, message = document.getElementById("message");
  try {
    const r = await fetch("/equipment/" + encodeURIComponent(id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(eq()) });
    const t = await r.text();
    if (!r.ok) throw new Error(t || "Could not update equipment.");
    message.textContent = t || "Equipment updated successfully."; message.className = "message success";
  } catch (err) { message.textContent = err.message; message.className = "message error"; }
});
</script>
</body>
</html>
